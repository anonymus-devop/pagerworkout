# config.yaml para Jekyll en GitHub Pages

title: Plataforma Académica Moderna
email: tu-email@ejemplo.com
description: >- 
  Plataforma para gestión de tareas y acceso a recursos académicos.
baseurl: "" # usa "" si está en el dominio raíz, o "/nombre-repo" si es repo en GitHub
url: "https://tu-usuario.github.io" # cambia "tu-usuario" por tu usuario de GitHub

theme: minima

# Opciones adicionales
plugins:
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown

exclude:
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock

# Personaliza la navegación o variables del sitio (opcional)
navbar_links:
  - title: SavvasRealize
    url: https://savvasrealize.com
  - title: Innovamat
    url: https://student.innovamat.com
  - title: Brightspace
    url: https://innovacolombia.brightspace.com/d2l/login
  - title: Gmail
    url: https://mail.google.com
  - title: Arukay
    url: https://app.arukay.com
  - title: Ediciones Norma
    url: https://edu.edicionesnorma.com
  - title: Google Académico
    url: https://scholar.google.com
