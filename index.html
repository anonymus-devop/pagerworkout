<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plataforma Académica</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a73e8" />
  <link rel="icon" href="icons/192.png" type="image/png" />

  <!-- CSS -->
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <!-- Botón del menú -->
  <button id="menu-toggle">☰</button>

  <!-- Menú lateral -->
  <nav id="menu" class="menu">
    <a href="https://student.innovamat.com" target="_blank">Innovamat</a>
    <a href="https://savvasrealize.com" target="_blank">Savvas</a>
    <a href="https://innovacolombia.brightspace.com/d2l/login" target="_blank">Brightspace</a>
    <a href="https://mail.google.com" target="_blank">Gmail</a>
    <a href="https://app.arukay.com" target="_blank">Arukay</a>
    <a href="https://edu.edicionesnorma.com" target="_blank">Ediciones Norma</a>
    <a href="https://scholar.google.com" target="_blank">Google Académico</a>
  </nav>

  <h1>Gestor de Tareas</h1>

  <!-- Formulario de tarea -->
  <form id="task-form">
    <input type="text" name="tarea" placeholder="Nueva tarea" required />
    <button type="submit">Agregar</button>
  </form>

  <!-- Lista de tareas -->
  <ul id="task-list"></ul>

  <!-- Botones de control -->
  <div class="controls">
    <button id="export-btn">Exportar tareas</button>
    <button id="import-btn">Importar tareas</button>
    <input type="file" id="import-file" accept="application/json" style="display:none" />
    <button id="login-icon" title="Iniciar sesión secreta">👤</button>
  </div>

  <!-- JS -->
  <script src="script.js"></script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.error('Error al registrar el SW:', err));
      });
    }
  </script>
</body>
</html>
